# Model arguments
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data arguments
dataset_loader: dataset_loader.mix_alpaca.get_dataset
dataset_holdout_split: holdout
dataset_train_split: train
dataset_test_split: test

# Weight arguments
weight_function: weight_function.uniform_weight.get_score

# SFT trainer config
bf16: true
eval_function: evaluator.evaluate.main
eval_args:
  - length_control: False
  - prompt_template_file: evaluator/eval_prompt.txt
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
learning_rate: 2.0e-05
log_level: info
logging_steps: 5  
logging_strategy: steps
lr_scheduler_type: cosine
max_seq_length: 1024
max_steps: -1
num_train_epochs: 1
output_dir: output/llama-3-8b-instruct-sft-full
overwrite_output_dir: true
per_device_train_batch_size: 1
per_device_eval_batch_size: 4
push_to_hub: false
remove_unused_columns: false
report_to:
- wandb
save_strategy: "steps"
save_steps: 100
save_total_limit: 1
seed: 42
warmup_ratio: 0.1