# Single-task evaluation. Shared sampling settings match comprehensive.yaml.
# Running this configuration makes live Jev calls and may incur charges.
schema_version: 1

run:
  seed: 20260924
  repetitions: 1
  max_calls: 960
  output_dir: "../results/adjacency-v1"

data:
  datasets: ["facebook", "ca-grqc", "power", "human-ppi"]
  data_dir: "../data/real"

sampling:
  method: "connected_frontier"
  node_counts: [32, 64, 128]
  samples_per_size: 20
  max_attempts: 100

tasks:
  adjacency_questions: 4
  distance_questions_per_threshold: 0
  distance_thresholds: []

model:
  provider: "typesafe"
  model: "jev-1.13.0"
  timeout_seconds: 30.0